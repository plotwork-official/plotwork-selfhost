# The self-hosted Plotwork engine on Kubernetes: a namespace, the server as a Deployment, a ClusterIP Service, and a NetworkPolicy
# that allows no egress at all. Create the token as a Secret first, never in this file:
#
#   kubectl apply -f kubernetes.yaml
#   kubectl -n plotwork create secret generic plotwork --from-literal=token="$(openssl rand -hex 32)"
#
# Agents and services in the cluster reach it at http://plotwork.plotwork.svc:3106/mcp with `Authorization: Bearer <token>`.
# The verify workflow of this repository applies this file as it is to a fresh kind cluster for every release.
apiVersion: v1
kind: Namespace
metadata:
  name: plotwork
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plotwork
  namespace: plotwork
  labels:
    app.kubernetes.io/name: plotwork
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plotwork
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plotwork
    spec:
      automountServiceAccountToken: false
      # Kubernetes would otherwise set PLOTWORK_PORT=tcp://<ip>:3106 in the pod for the Service below, over the server's own
      # setting of that name. The server stops with a message that says so; this keeps the variable the server's.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plotwork
          image: plotwork/selfhost:0.4.0-beta.1
          ports:
            - name: http
              containerPort: 3106
          env:
            - name: PLOTWORK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plotwork
                  key: token
            - name: PLOTWORK_PORT
              value: '3106'
            - name: PLOTWORK_WORKERS
              value: '2'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: plotwork
  namespace: plotwork
spec:
  selector:
    app.kubernetes.io/name: plotwork
  ports:
    - name: http
      port: 3106
      targetPort: http
---
# The server needs no egress, so it is given none. A cluster whose network plugin enforces policies (Calico, Cilium, and others)
# then cuts every outbound connection from the pods; the server's own checks already refuse to make one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plotwork-no-egress
  namespace: plotwork
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: plotwork
  policyTypes: ['Egress']
  egress: []
