{{- if and (not .Values.auth.existingSecret) .Values.auth.token }}
# The token given as auth.token. auth.existingSecret keeps it out of the release history; prefer that.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plotwork.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plotwork.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.auth.token | b64enc | quote }}
{{- end }}
