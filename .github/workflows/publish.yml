# Builds and publishes the self-hosted engine's container image when a tag `v<version>` is pushed.
#
# Nothing here compiles anything. dist/ is the bundle the private source repository built and tested, copied here by its
# release workflow, which then pushes the tag that starts this one. This workflow checks the files against checksums.txt,
# wraps them in distroless Node for linux/amd64 and linux/arm64, and pushes one image to two registries:
#
#   registry     image                                         tags
#   Docker Hub   vars.DOCKERHUB_IMAGE (plotwork/selfhost)      <version>, and beta or latest; a stable x.y.z also x.y
#   GitHub       ghcr.io/<this repository>                     the same
#
# Every image carries a build provenance attestation (SLSA, mode=max) and an SBOM from BuildKit, a signature made with
# Sigstore's keyless signing (cosign, the identity is this workflow), and a GitHub artifact attestation, so anyone can check
# that a digest was built here from a given commit:
#
#   cosign verify plotwork/selfhost:<version> \
#     --certificate-identity-regexp '^https://github.com/plotwork-official/plotwork-selfhost/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://plotwork/selfhost:<version> --repo plotwork-official/plotwork-selfhost
#
# After the image has run, the Helm chart in charts/plotwork-selfhost is packaged with the same version and pushed to
# oci://ghcr.io/<owner>/charts/plotwork-selfhost, signed and attested the same way, with GITHUB_TOKEN and no other secret.
#
#   tag               image tags                         GitHub Release
#   v0.1.0             0.1.0, 0.1, latest                 release, marked latest
#   v0.2.0-beta.1      0.2.0-beta.1, beta                 prerelease
#
# A published version is never changed: an image or chart is never overwritten. A run that stopped part way is finished
# instead of refused: a version whose image is in both registries with one digest and this workflow's signature is taken
# as published and not built again, and a chart this workflow pushed but did not sign is signed. Anything else that is
# already there is refused. To finish a tag whose run failed with an older copy of this file, run this workflow by hand
# on the default branch with that tag: it checks out the tag's files and runs this copy of the jobs.
#
# One-time setup (the `docker-publish` environment, its DOCKERHUB_TOKEN secret, the DOCKERHUB_USERNAME and DOCKERHUB_IMAGE
# variables, tag protection) is in the runbook of the source repository.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to finish, such as v0.3.0. Its files are checked out; nothing published is overwritten.
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag and the files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.facts.outputs.version }}
      channel: ${{ steps.facts.outputs.channel }}
      prerelease: ${{ steps.facts.outputs.prerelease }}
      minor: ${{ steps.facts.outputs.minor }}
    steps:
      # Full history, so the check below can ask whether the tagged commit is on the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag names this version
        id: facts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag '$TAG' must be v followed by a semantic version, such as v0.1.0 or v0.2.0-beta.1."
            exit 1
          fi
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::The tag is $TAG but VERSION says $version. Tag the commit that carries the version."
            exit 1
          fi
          # A tag on a commit that is not on the default branch is a release nobody reviewed.
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::The tagged commit is not on $DEFAULT_BRANCH."
            exit 1
          fi
          case "$version" in
            *-*) channel=beta; prerelease=true ;;
            *)   channel=latest; prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"
          echo "plotwork-selfhost $version, channel $channel"

      - name: Check the files against checksums.txt
        run: sha256sum --check --strict checksums.txt

      # The bundle contains other people's code and data, and the official vendor icons. Their licences and notices go into
      # the image, under /licenses, so files without them stop here.
      - name: Check the licence, the notices and the entries
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s THIRD-PARTY-NOTICES.md
          for entry in server.mjs engine-worker.mjs healthcheck.mjs; do test -s "dist/$entry"; done
          test -d dist/icons

  publish:
    name: Build, push, sign and attest
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Create this environment under Settings, Environments, with the secret DOCKERHUB_TOKEN (a Docker Hub access token with
    # read and write on the one repository) and, if a person should approve every publish, required reviewers.
    environment: docker-publish
    permissions:
      contents: read
      packages: write # pushing to ghcr.io
      id-token: write # Sigstore keyless signing and the artifact attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
      hub: ${{ steps.names.outputs.hub }}
      ghcr: ${{ steps.names.outputs.ghcr }}
      resumed: ${{ steps.existing.outputs.digest != '' }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Name the images
        id: names
        env:
          HUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "$HUB_USER" ]; then
            echo "::error::Set the variable DOCKERHUB_USERNAME to the Docker Hub account that owns the image."
            exit 1
          fi
          hub="${HUB_IMAGE:-plotwork/selfhost}"
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "hub=$hub"
            echo "ghcr=$ghcr"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Releases are immutable: a version that already has an image is never pushed again. When an earlier run of this
      # workflow published it in both registries, with one digest and its signature, this run takes that digest and goes on
      # to the jobs that stopped. Anything else (one registry only, two digests, no signature from here) is refused.
      - name: Refuse a version that is already published, or pick up the one an earlier run published
        id: existing
        env:
          HUB: ${{ steps.names.outputs.hub }}
          GHCR: ${{ steps.names.outputs.ghcr }}
        run: |
          set -euo pipefail
          found=()
          for image in "$HUB" "$GHCR"; do
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              found+=("$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)")
            fi
          done
          if [ "${#found[@]}" -eq 0 ]; then exit 0; fi
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@"
          digest="${found[0]}"
          if [ "${#found[@]}" -ne 2 ] || [ "${found[1]}" != "$digest" ] \
            || ! cosign verify "$HUB@$digest" --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1 \
            || ! cosign verify "$GHCR@$digest" --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
            echo "::error::$VERSION already exists. Releases are immutable. Bump the version and tag again."
            exit 1
          fi
          echo "::notice::$VERSION was published by an earlier run ($digest). Finishing that release."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Choose the image tags
        id: tags
        env:
          HUB: ${{ steps.names.outputs.hub }}
          GHCR: ${{ steps.names.outputs.ghcr }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          MINOR: ${{ needs.verify.outputs.minor }}
        run: |
          set -euo pipefail
          names="$VERSION $CHANNEL"
          if [ "$PRERELEASE" = "false" ]; then names="$names $MINOR"; fi
          {
            echo "list<<TAGS"
            for image in "$HUB" "$GHCR"; do
              for name in $names; do echo "$image:$name"; done
            done
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      # Keyless: the signature is bound to this workflow's identity through GitHub's OIDC token, with no key to keep.
      - name: Sign the image in both registries
        if: steps.existing.outputs.digest == ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          HUB: ${{ steps.names.outputs.hub }}
          GHCR: ${{ steps.names.outputs.ghcr }}
        run: |
          set -euo pipefail
          cosign sign --yes "$HUB@$DIGEST"
          cosign sign --yes "$GHCR@$DIGEST"

      - name: Attest the build on Docker Hub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ steps.names.outputs.hub }}
          subject-digest: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          push-to-registry: true

      - name: Attest the build on GitHub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Pull the published image and run it
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pulled by digest from each registry, verified, then run the way the self-hosting guide runs it.
      - name: Verify the signatures and run the image
        env:
          HUB: ${{ needs.publish.outputs.hub }}
          GHCR: ${{ needs.publish.outputs.ghcr }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@"
          for image in "$HUB" "$GHCR"; do
            cosign verify "$image@$DIGEST" --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "Verified the signature of $image@$DIGEST."
          done
          token=$(openssl rand -hex 32)
          docker run -d --name plotwork --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3106:3106 -e PLOTWORK_TOKEN="$token" "$HUB@$DIGEST"
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3106/healthz -o health.json; then break; fi
            sleep 1
          done
          cat health.json
          node -e 'const health = JSON.parse(require("fs").readFileSync("health.json", "utf8")); if (health.status !== "ok" || health.network !== "none" || health.telemetry !== "off") { console.error("The image did not report ok, no network and no telemetry."); process.exit(1) }'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3106/v1/diagrams/validate -H 'content-type: application/json' -d '{"source":"flow"}')
          if [ "$status" != "401" ]; then
            echo "::error::A request without the token answered $status, not 401."
            exit 1
          fi
          docker rm -f plotwork >/dev/null
          echo "The published image starts, reports no network and no telemetry, and refuses a request without its token." >> "$GITHUB_STEP_SUMMARY"

  # The Helm chart in charts/plotwork-selfhost, released with the image it runs: the same version, pushed only after that
  # image is published and has run. It needs no secret: GITHUB_TOKEN pushes to ghcr.io, as it does for the image, and the
  # signature is keyless, with this workflow's identity. It has no environment because it publishes nothing to Docker Hub,
  # and it starts only after the publish job, which the docker-publish environment already gates, succeeded.
  chart:
    name: Package, push and sign the Helm chart
    needs: [verify, publish, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # pushing the chart to ghcr.io
      id-token: write # Sigstore keyless signing and the artifact attestation
      attestations: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      HELM_VERSION: v3.19.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # Pinned, and checked against the SHA-256 Helm publishes, rather than whatever the runner image carries.
      - name: Install Helm
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/helm" --strip-components 1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the chart carries this version
        run: |
          set -euo pipefail
          chart=charts/plotwork-selfhost/Chart.yaml
          grep -qx "version: $VERSION # x-release-please-version" "$chart" || { echo "::error::$chart does not carry version $VERSION."; exit 1; }
          grep -qx "appVersion: \"$VERSION\" # x-release-please-version" "$chart" || { echo "::error::$chart does not carry appVersion $VERSION."; exit 1; }
          helm lint charts/plotwork-selfhost --strict --set auth.existingSecret=plotwork

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Helm's login writes only Helm's own credentials file. cosign reads Docker's, and without this its signature
      # upload is refused with "UNAUTHORIZED: unauthenticated", as it was for 0.3.0.
      - name: Log cosign in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Releases are immutable: a chart version that is already there is never pushed again. Only a run finishing a release
      # whose image an earlier run published may find its chart there, pushed by that run; it takes the chart's digest and
      # signs it below if that run did not.
      - name: Package and push the chart
        id: push
        env:
          RESUMED: ${{ needs.publish.outputs.resumed }}
        run: |
          set -euo pipefail
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/plotwork-selfhost"
          if helm show chart "$registry/plotwork-selfhost" --version "$VERSION" >/dev/null 2>&1; then
            if [ "$RESUMED" != "true" ]; then
              echo "::error::$ref:$VERSION already exists. Releases are immutable. Bump the version and tag again."
              exit 1
            fi
            helm pull "$registry/plotwork-selfhost" --version "$VERSION" --destination "$RUNNER_TEMP/existing" 2>&1 | tee "$RUNNER_TEMP/push.log"
            echo "::notice::$ref:$VERSION was pushed by an earlier run. Finishing it."
          else
            helm package charts/plotwork-selfhost --destination "$RUNNER_TEMP/chart"
            helm push "$RUNNER_TEMP/chart/plotwork-selfhost-$VERSION.tgz" "$registry" 2>&1 | tee "$RUNNER_TEMP/push.log"
          fi
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/push.log")
          test -n "$digest" || { echo "::error::helm printed no digest."; exit 1; }
          {
            echo "ref=$ref"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      # Keyless, as the image: the signature is bound to this workflow's identity through GitHub's OIDC token. A chart an
      # earlier run already signed is not signed again.
      - name: Sign the chart
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          verify() {
            cosign verify "$REF@$DIGEST" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          }
          if ! verify 2>/dev/null; then
            cosign sign --yes "$REF@$DIGEST"
            verify
          fi
          echo "Pushed and signed the chart $REF:$VERSION ($DIGEST)." >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Cut the GitHub Release
    needs: [verify, publish, smoke, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          HUB: ${{ needs.publish.outputs.hub }}
          GHCR: ${{ needs.publish.outputs.ghcr }}
          CHART: ${{ needs.chart.outputs.ref }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a release."
            exit 0
          fi
          {
            echo "The self-hosted Plotwork engine $VERSION, for linux/amd64 and linux/arm64."
            echo
            echo '```sh'
            echo "docker pull $HUB:$VERSION"
            echo "docker pull $GHCR:$VERSION"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Signed with Sigstore and attested by this repository's publish workflow. To check a pull:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$HUB:$VERSION --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "The Helm chart of this version, signed the same way (digest \`$CHART_DIGEST\`):"
            echo
            echo '```sh'
            echo "helm install plotwork oci://$CHART --version $VERSION --namespace plotwork --set auth.existingSecret=plotwork"
            echo '```'
            echo
            echo "How to run it: https://docs.plotwork.dev/mcp/self-hosting"
          } > notes.md
          flags=(--title "plotwork-selfhost $VERSION" --notes-file notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" checksums.txt THIRD-PARTY-NOTICES.md LICENSE
